alert:
  auto_block_enabled: false
  clear_on_start: false
  cooldown_seconds: 30
  countdown_seconds: 5
  maintenance_interval_seconds: 10
  show_only_current_session: true
attack_user_agents:
- sqlmap
- nikto
- hydra
- nmap
- gobuster
- dirbuster
- wpscan
- masscan
- burpsuite
- acunetix
- havij
blocking:
  default_duration_minutes: 60
  ufw_block_command: sudo ufw insert 1 deny from
  ufw_unblock_command: sudo ufw delete deny from
dashboard:
  debug: false
  host: 0.0.0.0
  port: 5000
database:
  connect_timeout: 5
  dbname: ids_system
  enabled: true
  host: 127.0.0.1
  password: '123456'
  port: 5432
  user: ids_user
detection:
  dos_burst_packets: 800
  dos_burst_seconds: 3
  dos_pps: 400
  dos_short_flows: 18
  generic_tool_prob: 0.75
  generic_tool_user_agents:
  - curl
  - python-requests
  http_bruteforce_login_fails: 5
  http_dos_req_rate: 25
  http_scan_ratio_4xx: 0.6
  http_scan_unique_urls: 10
  max_event_age_seconds: 0
  scan_min_ports: 4
  scan_short_flows: 15
  scan_unique_ports: 12
  suricata_min_severity: 3
log:
  path: data/pfsense_eve.json
  poll_interval: 0.2
  start_at_end: true
model:
  data_csv_path: data/sample_dataset.csv
  model_path: models/detector_model.joblib
network:
  attacker_selection: auto
  protect_local_ips: true
  protected_networks: []
  server_ips:
  - 192.168.78.132
  server_ports:
  - 21
  - 22
  - 23
  - 25
  - 53
  - 80
  - 110
  - 143
  - 443
  - 445
  - 1433
  - 3306
  - 3389
  - 5432
  - 5900
  - 6379
  - 8000
  - 8008
  - 8080
  - 8443
  - 8888
paths:
  login_paths:
  - /login
  - /login.php
  - /dvwa/login.php
  - /admin
  - /admin/login
  - /wp-login.php
  - /user/login
  - /auth/login
pfsense:
  enabled: true
  host: 192.168.78.136
  local_log_path: data/pfsense_eve.json
  method: ssh_sftp
  password: '123456'
  port: 22
  start_from_end: true
  suricata_log_path: /var/log/suricata/eve.json
  sync_interval: 1
  username: admin
scoring:
  alpha: 0.4
  fast_detection: true
  high_threshold: 0.85
  idle_reset_seconds: 30
  theta: 0.6
sliding_window:
  window_size_n: 20
  window_time_t: 60.0
whitelist_ips:
- 127.0.0.1
- ::1
- 192.168.78.136
- 10.0.0.1
worker:
  batch_size: 20
  poll_interval: 0.2
